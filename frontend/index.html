<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediGuard AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body { margin:0; font-family:Inter; background:#fff; color:#111; scroll-behavior:smooth; }

.navbar {
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  border-bottom:1px solid #eee;
}

.btn {
  padding:10px 20px;
  border-radius:6px;
  border:none;
  cursor:pointer;
}
.primary { background:#6c47ff; color:white; }
.outline { border:1px solid #ccc; background:white; }

.hero {
  text-align:center;
  padding:100px 20px;
  position:relative;
}

.hero h1 { font-size:3rem; }
.hero p { color:#666; }

.bg-circle {
  position:absolute;
  width:280px;
  height:280px;
  background:rgba(108,71,255,0.08);
  border-radius:50%;
  top:20%;
  left:10%;
  animation:float 10s infinite;
}

.bg-circle2 { top:60%; left:75%; animation-delay:3s; }

@keyframes float {
  0%{transform:translateY(0)}
  50%{transform:translateY(-30px)}
  100%{transform:translateY(0)}
}

.section {
  padding:80px 20px;
  background:#fafafa;
  text-align:center;
}

.cards {
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
}

.card {
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:25px;
  width:260px;
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

.auth-section {
  padding:100px 20px;
  text-align:center;
}

.auth-container {
  display:flex;
  justify-content:center;
  gap:30px;
  flex-wrap:wrap;
}

.auth-box {
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:30px;
  width:300px;
}

.auth-box input {
  width:100%;
  margin:10px 0;
  padding:10px;
}

.footer {
  padding:20px;
  text-align:center;
  border-top:1px solid #eee;
}
</style>
</head>

<body>

<div class="navbar">
  <h3>MediGuard</h3>
  <div>
    <button class="btn outline" onclick="scrollToAuth()">Login</button>
    <button class="btn primary" onclick="scrollToAuth()">Sign Up</button>
    <button class="btn outline" onclick="goAdmin()">Admin</button>
  </div>
</div>

<section class="hero">
  <div class="bg-circle"></div>
  <div class="bg-circle bg-circle2"></div>

  <h1>Health insurance that feels human</h1>
  <p>AI-powered claim validation made simple</p>
  <button class="btn primary" onclick="scrollToAuth()">Get Started</button>
</section>

<section class="section">
  <h2>How it works</h2>
  <div class="cards">
    <div class="card"><h4>Upload</h4><p>Upload your document</p></div>
    <div class="card"><h4>AI Check</h4><p>Fraud detection</p></div>
    <div class="card"><h4>Result</h4><p>Instant decision</p></div>
  </div>
</section>

<section class="auth-section" id="auth">
  <h2>Get Started</h2>

  <div class="auth-container">

    <div class="auth-box">
      <h3>Login</h3>
      <input id="loginEmail" placeholder="Email">
      <input id="loginPass" type="password" placeholder="Password">
      <button class="btn primary" onclick="login()">Login</button>
    </div>

    <div class="auth-box">
      <h3>Sign Up</h3>
      <input id="signupEmail" placeholder="Email">
      <input id="signupPass" type="password" placeholder="Password">
      <button class="btn primary" onclick="signup()">Create Account</button>
    </div>

  </div>
</section>

<div class="footer">© MediGuard AI</div>

<script>

function scrollToAuth(){
  document.getElementById("auth").scrollIntoView();
}

function goAdmin(){
  window.location.href="dash.html";
}

function signup(){
  let email = signupEmail.value;
  let pass = signupPass.value;

  if(!email || !pass){
    alert("Fill all fields");
    return;
  }

  localStorage.setItem("user", JSON.stringify({email, pass}));
  alert("Account created");
}

function login(){
  let user = JSON.parse(localStorage.getItem("user"));

  if(!user || user.email !== loginEmail.value || user.pass !== loginPass.value){
    alert("Invalid credentials");
    return;
  }

  window.location.href = "user.html";
}

</script>

</body>
</html>
