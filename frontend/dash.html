<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:Inter;
  background:#fafafa;
}

/* HEADER */
.header {
  padding:20px 40px;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  background:#fff;
}

/* CONTAINER */
.container {
  max-width:1100px;
  margin:auto;
  padding:30px;
}

/* CARD */
.card {
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

/* TABLE */
table {
  width:100%;
  border-collapse:collapse;
}

th, td {
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:left;
}

/* STATUS */
.status {
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
}

.approved { background:#dcfce7; color:#16a34a; }
.rejected { background:#fee2e2; color:#dc2626; }
.pending { background:#fef3c7; color:#d97706; }

/* BUTTONS */
.btn {
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
  margin-right:5px;
}

.approve { background:#22c55e; color:white; }
.reject { background:#ef4444; color:white; }

/* TOP BUTTON */
.top-btn {
  background:#6c47ff;
  color:white;
  padding:8px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <h3>MediGuard Admin</h3>
  <button class="top-btn" onclick="goHome()">Home</button>
</div>

<div class="container">

  <div class="card">
    <h2>Claims Management</h2>

    <table id="table">
      <tr>
        <th>ID</th>
        <th>User</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Manual Actions</th>
      </tr>
    </table>

  </div>

</div>

<script>

/* LOAD CLAIMS */
let claims = JSON.parse(localStorage.getItem("claims")) || [];

/* FALLBACK DATA */
if(claims.length === 0){
  claims = [
    {email:"rahul@mail.com", amount:45000, status:"Pending"},
    {email:"anita@mail.com", amount:120000, status:"Approved"},
    {email:"vikram@mail.com", amount:8000, status:"Rejected"}
  ];
}

/* RENDER */
function render(){
  let table = document.getElementById("table");

  table.innerHTML = `
    <tr>
      <th>ID</th>
      <th>User</th>
      <th>Amount</th>
      <th>Status</th>
      <th>Manual Actions</th>
    </tr>
  `;

  claims.forEach((c, i)=>{
    table.innerHTML += `
      <tr>
        <td>CLM${i+1}</td>
        <td>${c.email || "User"}</td>
        <td>₹${c.amount || 0}</td>
        <td><span class="status ${c.status.toLowerCase()}">${c.status}</span></td>
        <td>
          <button class="btn approve" onclick="updateStatus(${i}, 'Approved')">Approve</button>
          <button class="btn reject" onclick="updateStatus(${i}, 'Rejected')">Reject</button>
        </td>
      </tr>
    `;
  });
}

/* UPDATE */
function updateStatus(index, status){
  claims[index].status = status;
  localStorage.setItem("claims", JSON.stringify(claims));
  render();
}

/* NAV */
function goHome(){
  window.location.href = "index.html";
}

render();

</script>

</body>
</html>
