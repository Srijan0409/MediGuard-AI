<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | MediGuard AI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            padding: 25px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .stat-card:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 40px rgba(15, 61, 62, 0.15);
        }

        .stat-val {
            font-size: 2.5rem;
            font-weight: 800;
            display: block;
            margin: 10px 0;
            color: var(--primary);
        }

        .stat-label {
            color: #666;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 992px) {
            .charts-row { grid-template-columns: 1fr; }
        }

        .chart-container {
            height: 350px;
            position: relative;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            width: 300px;
            outline: none;
        }

        .filter-select {
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            cursor: pointer;
            outline: none;
        }
    </style>
</head>
<body>

    <nav class="navbar fade-in">
        <div class="logo">MEDIGUARD ADMIN</div>
        <div class="nav-links">
            <button class="btn btn-outline" onclick="location.href='index.html'">View Site</button>
        </div>
    </nav>

    <main class="fade-in" style="padding: 40px 8%;">
        
        <header style="margin-bottom: 40px;">
            <h1 style="color: var(--primary); font-size: 2.5rem;">Claims Analytics</h1>
            <p style="color: #666;">Real-time overview of MediGuard AI validation metrics.</p>
        </header>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="glass-card stat-card" style="border-top: 5px solid var(--primary);">
                <span class="stat-label">Total Claims</span>
                <span class="stat-val" id="totalCount">0</span>
            </div>
            <div class="glass-card stat-card" style="border-top: 5px solid #16a34a;">
                <span class="stat-label">Approved</span>
                <span class="stat-val" id="approvedCount">0</span>
            </div>
            <div class="glass-card stat-card" style="border-top: 5px solid #dc2626;">
                <span class="stat-label">Rejected</span>
                <span class="stat-val" id="rejectedCount">0</span>
            </div>
            <div class="glass-card stat-card" style="border-top: 5px solid #d97706;">
                <span class="stat-label">Manual Review</span>
                <span class="stat-val" id="reviewCount">0</span>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="charts-row">
            <div class="glass-card">
                <h3 style="margin-bottom: 20px;">Distribution</h3>
                <div class="chart-container">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
            <div class="glass-card">
                <h3 style="margin-bottom: 20px;">Claim Trends</h3>
                <div class="chart-container">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Claims Table -->
        <div class="glass-card">
            <div class="controls-bar">
                <h3>All Claims Log</h3>
                <div style="display: flex; gap: 15px;">
                    <input type="text" id="searchInput" class="search-box" placeholder="Search by filename..." onkeyup="filterTable()">
                    <select id="statusFilter" class="filter-select" onchange="filterTable()">
                        <option value="all">All Statuses</option>
                        <option value="approved">Approved Only</option>
                        <option value="rejected">Rejected Only</option>
                        <option value="manual review">Review Required</option>
                    </select>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="background: rgba(15, 61, 62, 0.03); text-align: left;">
                            <th style="padding: 20px;">Claim ID</th>
                            <th style="padding: 20px;">Filename</th>
                            <th style="padding: 20px;">Status</th>
                            <th style="padding: 20px;">Confidence</th>
                            <th style="padding: 20px;">Amount</th>
                            <th style="padding: 20px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- Data rows -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        let allClaims = [];
        let pieChart, barChart;

        async function fetchDashboardData() {
            try {
                const res = await fetch("http://localhost:5000/api/claims");
                const json = await res.json();
                if (json.success) {
                    allClaims = json.data;
                    updateStats();
                    renderCharts();
                    renderTable(allClaims);
                }
            } catch (err) {
                console.error("Dashboard error:", err);
            }
        }

        function updateStats() {
            const approved = allClaims.filter(c => (c.decision || "").toLowerCase() === 'approved').length;
            const rejected = allClaims.filter(c => (c.decision || "").toLowerCase() === 'rejected').length;
            const review = allClaims.filter(c => (c.decision || "").toLowerCase() === 'manual review').length;

            document.getElementById("totalCount").textContent = allClaims.length;
            document.getElementById("approvedCount").textContent = approved;
            document.getElementById("rejectedCount").textContent = rejected;
            document.getElementById("reviewCount").textContent = review;
        }

        function renderCharts() {
            const approved = allClaims.filter(c => (c.decision || "").toLowerCase() === 'approved').length;
            const rejected = allClaims.filter(c => (c.decision || "").toLowerCase() === 'rejected').length;
            const review = allClaims.filter(c => (c.decision || "").toLowerCase() === 'manual review').length;

            // Pie Chart
            const pieCtx = document.getElementById('pieChart').getContext('2d');
            if (pieChart) pieChart.destroy();
            pieChart = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Approved', 'Rejected', 'Review'],
                    datasets: [{
                        data: [approved, rejected, review],
                        backgroundColor: ['#2E8B57', '#dc2626', '#d97706'],
                        borderWidth: 0
                    }]
                },
                options: { maintainAspectRatio: false, cutout: '70%' }
            });

            // Bar Chart (Mocking trends based on index)
            const barCtx = document.getElementById('barChart').getContext('2d');
            if (barChart) barChart.destroy();
            barChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                    datasets: [{
                        label: 'Claims Processed',
                        data: [12, 19, 3, 5, 2, allClaims.length],
                        backgroundColor: '#0F3D3E',
                        borderRadius: 10
                    }]
                },
                options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById("adminTableBody");
            tbody.innerHTML = "";
            
            data.slice().reverse().forEach(c => {
                const status = (c.decision || "Pending");
                const statusClass = status.toLowerCase().replace(" ", "-");
                const shortId = (c._id || "000000").substring(0, 6).toUpperCase();
                
                tbody.innerHTML += `
                    <tr style="border-bottom: 1px solid rgba(0,0,0,0.05);">
                        <td style="padding: 15px 20px; font-weight: 600;">#${shortId}</td>
                        <td style="padding: 15px 20px;">${c.filename}</td>
                        <td style="padding: 15px 20px;"><span class="status-badge" style="font-size: 0.7rem; padding: 4px 12px; margin: 0;">${status}</span></td>
                        <td style="padding: 15px 20px;">${c.probability}%</td>
                        <td style="padding: 15px 20px; font-weight: 600;">₹${(c.amount || 0).toLocaleString()}</td>
                        <td style="padding: 15px 20px;">
                            <button class="btn btn-outline" style="padding: 5px 12px; font-size: 0.8rem;" onclick="alert('Viewing full details for ${c.filename}')">View</button>
                        </td>
                    </tr>
                `;
                
                // Add the class dynamically to the last tr's badge
                const badges = tbody.getElementsByClassName('status-badge');
                const lastBadge = badges[badges.length - 1];
                lastBadge.parentElement.parentElement.classList.add(statusClass);
            });
        }

        function filterTable() {
            const search = document.getElementById("searchInput").value.toLowerCase();
            const filter = document.getElementById("statusFilter").value.toLowerCase();
            
            const filtered = allClaims.filter(c => {
                const matchesSearch = c.filename.toLowerCase().includes(search);
                const matchesStatus = filter === 'all' || (c.decision || "").toLowerCase() === filter;
                return matchesSearch && matchesStatus;
            });
            
            renderTable(filtered);
        }

        fetchDashboardData();
    </script>
</body>
</html>
